services:
  db:
    image: postgres:16-alpine
    container_name: arenahub_db
    restart: always
    environment:
      POSTGRES_USER: ${ARENAHUB_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ARENAHUB_DB_PASSWORD_LOCAL:-postgres}
      POSTGRES_DB: arenahub
    ports:
      - '5432:5432'
    volumes:
      - arenahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARENAHUB_DB_USER:-postgres} -d arenahub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arenahubnetwork

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arenahub_app
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PORT=8080
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arenahubnetwork

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arenahub_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DOCKER_PGADMIN_DEFAULT_EMAIL:-admin@arenahub.com}
      PGADMIN_DEFAULT_PASSWORD: ${DOCKER_PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - '15432:80'
    depends_on:
      - db
    networks:
      - arenahubnetwork

  proxy:
    image: nginx:alpine
    container_name: arenahub_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - arenahubnetwork

volumes:
  arenahub_postgres_data:

networks:
  arenahubnetwork:
    driver: bridge